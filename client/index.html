<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- The brand faces are self-hosted from /fonts as variable fonts, so there
         is no Google Fonts stylesheet to fetch and no third-party connection to
         warm. Preload both: they are the two files every page needs before it
         can paint text, and discovering them via the CSS costs a round trip. -->
    <link rel="preload" href="/fonts/BricolageGrotesque-Variable.ttf" as="font" type="font/ttf" crossorigin />
    <link rel="preload" href="/fonts/Sora-Variable.ttf" as="font" type="font/ttf" crossorigin />
    <!-- Public pages currently pull their imagery from Unsplash (see the note in
         docs/UX_AND_PERFORMANCE_PLAN.md — these are placeholders awaiting real NIQS
         photography). Until they are replaced, warm the connection: the homepage
         alone makes 6 requests to this host, and without a hint the first one pays
         a full DNS + TCP + TLS round trip before a single byte of image arrives. -->
    <link rel="preconnect" href="https://images.unsplash.com" crossorigin />
    <title>NIQS — Nigerian Institute of Quantity Surveyors</title>

    <!-- Favicon / browser tab & taskbar icon.
         All generated from NIQS-LOGO-SQUARE.png by scripts/build-favicons.py —
         that file is the crest re-centred on a square canvas, because the nav
         PNG's crest sits left of its own centre and looked off-axis as an icon.

         The four links used to point at the 512px PNG directly. Two things were
         missing and both were visible from outside: /favicon.ico returned 404 on
         the live domain (browsers and Google's favicon fetcher request that path
         whether or not a <link> asks them to), and Google only shows a favicon
         beside a search result when it is square and a multiple of 48px — which
         512 is not, but 192 is. -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- Browser chrome colour (tab bar on mobile) -->
    <meta name="theme-color" content="#000066" />

    <!-- SEO -->
    <meta name="description" content="The Nigerian Institute of Quantity Surveyors — Nigeria's professional construction cost managers since 1969. Committed to sustainable national development." />

    <!-- No <link rel="canonical"> here, on purpose.
         This one file is served for every route, so a canonical written into it
         would tell a search engine that /about, /membership and all 37 chapter
         pages are duplicates of the homepage — which is how a site gets its
         subpages dropped from the index. It is inserted per route instead, from
         useCanonical.js. Host canonicalisation (www., niqsng.org, http) is done
         properly, at the HTTP level, by the 301s in public/.htaccess. -->

    <!-- Open Graph — link preview on WhatsApp, Twitter, LinkedIn etc. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="NIQS" />
    <meta property="og:title" content="NIQS — Nigerian Institute of Quantity Surveyors" />
    <!-- No membership count here. This file is static, so any figure in it is one
         nobody will remember to update: it still read "10,000+" on 2026-08-06, the
         day the site itself started publishing a live 14,022 from the register —
         and this is the text that appears when the site is shared on WhatsApp. The
         chapter count is safe because it only changes when the Institute creates a
         chapter. -->
    <meta property="og:description" content="Nigeria's professional construction cost managers since 1969. Serving members across all 37 state chapters." />
    <!-- Purpose-built card rather than the bare logo: it is opaque (a transparent
         PNG composites against whatever colour the client picks) and lays the crest
         out inside the centre square, so scrapers that crop to a square — WhatsApp's
         small card especially — keep the crest centred instead of clipping it. -->
    <meta property="og:image" content="https://niqs.org.ng/og-image.jpg" />
    <meta property="og:image:type" content="image/jpeg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Nigerian Institute of Quantity Surveyors — established 1969" />
    <!-- These pointed at niqs-website.vercel.app until 2026-08-07. The site is
         not served from Vercel — the domain resolves to the Apache host — so
         every link shared on WhatsApp or LinkedIn was previewing an image from,
         and advertising the address of, a deployment nobody was meant to see.

         og:url stays fixed at the homepage rather than tracking the route, and
         that is a real limitation rather than an oversight: link scrapers do not
         execute JavaScript, so they read this file exactly as it leaves the
         server. Sharing a deep link therefore previews as the Institute rather
         than as that page. Fixing it properly means pre-rendering the public
         routes — see docs/SEO_AND_ANALYTICS.md. -->
    <meta property="og:url" content="https://niqs.org.ng/" />
    <meta property="og:locale" content="en_NG" />

    <!-- Twitter card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NIQS — Nigerian Institute of Quantity Surveyors" />
    <meta name="twitter:description" content="Nigeria's professional construction cost managers since 1969." />
    <meta name="twitter:image" content="https://niqs.org.ng/og-image.jpg" />

    <!-- Structured data. This is what lets Google show the crest, the official
         site and the Institute's profile in a knowledge panel beside the search
         results, rather than a bare blue link. Kept to facts that are stable and
         verifiable — no membership figure, for the reason given above the
         og:description. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://niqs.org.ng/#organization",
      "name": "Nigerian Institute of Quantity Surveyors",
      "alternateName": "NIQS",
      "url": "https://niqs.org.ng/",
      "logo": "https://niqs.org.ng/NIQS-LOGO-SQUARE.png",
      "image": "https://niqs.org.ng/og-image.jpg",
      "description": "The professional body for quantity surveyors in Nigeria, established in 1969. Construction cost managers serving members across all 37 state chapters.",
      "foundingDate": "1969",
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "QS Olusegun Ajanlekoko House, No. 24, NIQS Crescent, Mabushi District",
        "addressLocality": "Abuja",
        "addressCountry": "NG"
      },
      "email": "info@niqs.org.ng",
      "areaServed": { "@type": "Country", "name": "Nigeria" }
    }
    </script>
  </head>
  <body>
    <!-- NIQS branded preloader — visible until React mounts (removed in main.jsx) -->
    <style>
      #niqs-splash {
        position: fixed; inset: 0; z-index: 9999;
        background: #000066;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 22px; transition: opacity .45s ease;
      }
      #niqs-splash.done { opacity: 0; pointer-events: none; }
      .niqs-splash-badge { position: relative; width: 108px; height: 108px; }
      .niqs-splash-badge img {
        position: absolute; inset: 18px; width: 72px; height: 72px;
        object-fit: contain; animation: niqs-breathe 2.2s ease-in-out infinite;
      }
      .niqs-splash-ring {
        position: absolute; inset: 0; border-radius: 50%;
        border: 3px solid rgba(217,182,80,.18);
        border-top-color: #D9B650;
        animation: niqs-spin 1s linear infinite;
      }
      .niqs-splash-name {
        font-family: 'Bricolage Grotesque', sans-serif;
        color: #fff; font-weight: 800; font-size: 15px;
        letter-spacing: .22em; text-transform: uppercase; text-align: center;
        line-height: 1.7; padding: 0 24px;
      }
      .niqs-splash-name em { font-style: normal; color: #D9B650; }
      .niqs-splash-bar {
        width: 140px; height: 2px; border-radius: 2px; overflow: hidden;
        background: rgba(255,255,255,.12); position: relative;
      }
      .niqs-splash-bar::after {
        content: ''; position: absolute; top: 0; left: -40%; width: 40%; height: 100%;
        background: #D9B650; animation: niqs-slide 1.1s ease-in-out infinite;
      }
      @keyframes niqs-spin { to { transform: rotate(360deg); } }
      @keyframes niqs-breathe { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.07); } }
      @keyframes niqs-slide { to { left: 100%; } }
    </style>
    <div id="niqs-splash" aria-hidden="true">
      <div class="niqs-splash-badge">
        <div class="niqs-splash-ring"></div>
        <img src="/NIQS-LOGO-PNG-NAV.png" alt="" />
      </div>
      <div class="niqs-splash-name">Nigerian Institute of<br /><em>Quantity Surveyors</em></div>
      <div class="niqs-splash-bar"></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
